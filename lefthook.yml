# Hooks de Git (decisão D-6). Instalados automaticamente pelo script "prepare" do npm.
commit-msg:
  commands:
    conventional-commits:
      run: npx --no -- commitlint --edit {1}

pre-commit:
  parallel: true
  commands:
    lint:
      glob: '*.{ts,tsx,js,mjs}'
      run: npx eslint --max-warnings=0 {staged_files}
    format:
      glob: '*.{ts,tsx,js,mjs,json,css,md,yml,yaml}'
      run: npx prettier --check {staged_files}

pre-push:
  commands:
    typecheck:
      run: npm run typecheck
    unit:
      run: npm run test:unit
